name: Praktimarc GitHub Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*-praktimarc.*'

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || (github.ref_name == 'master' && startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Determine release version
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          TAG="v${VERSION}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${VERSION}." >&2
              exit 1
            fi
          else
            EXPECTED_SUBJECT="release: ${TAG}"
            ACTUAL_SUBJECT="$(git log -1 --pretty=%s)"
            if [ "${ACTUAL_SUBJECT}" != "${EXPECTED_SUBJECT}" ]; then
              echo "Release commit subject '${ACTUAL_SUBJECT}' does not match '${EXPECTED_SUBJECT}'." >&2
              exit 1
            fi
          fi

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Verify and package with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Verify release artifacts
        shell: bash
        run: |
          for file in \
            "target/mikrotik-${VERSION}.jar" \
            "target/mikrotik-${VERSION}-sources.jar" \
            "target/mikrotik-${VERSION}-javadoc.jar"
          do
            if [ ! -f "${file}" ]; then
              echo "Missing release artifact: ${file}" >&2
              exit 1
            fi
          done

      - name: Create annotated release tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TARGET="$(git rev-list -n 1 "${TAG}")"
            if [ "${TARGET}" != "${GITHUB_SHA}" ]; then
              echo "Existing tag ${TAG} points to ${TARGET}, expected ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(
            "target/mikrotik-${VERSION}.jar"
            "target/mikrotik-${VERSION}-sources.jar"
            "target/mikrotik-${VERSION}-javadoc.jar"
          )
          NOTES_FILE="docs/releases/${TAG}.md"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          elif [ -f "${NOTES_FILE}" ]; then
            gh release create "${TAG}" "${files[@]}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "${TAG}" \
              --generate-notes
          fi
