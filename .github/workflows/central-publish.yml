name: Stage Maven Central Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact existing GitHub release version to stage (without v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: central-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release preparation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 11, Central credentials and signing key
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Install pinned Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_VERSION="3.9.16"
          ARCHIVE="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          BASE_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"

          curl --fail --location --show-error --silent --retry 3 \
            --output "${ARCHIVE}" "${BASE_URL}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl --fail --location --show-error --silent --retry 3 \
            --output "${ARCHIVE}.sha512" "${BASE_URL}/apache-maven-${MAVEN_VERSION}-bin.tar.gz.sha512"

          EXPECTED_SHA512="$(tr -d '[:space:]' < "${ARCHIVE}.sha512")"
          if [[ ! "${EXPECTED_SHA512}" =~ ^[0-9a-fA-F]{128}$ ]]; then
            echo "Invalid official Maven SHA-512 checksum file." >&2
            exit 1
          fi
          ACTUAL_SHA512="$(sha512sum "${ARCHIVE}" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA512}" != "${EXPECTED_SHA512}" ]]; then
            echo "Apache Maven archive checksum mismatch." >&2
            exit 1
          fi

          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"
          echo "MAVEN_HOME=${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}" >> "${GITHUB_ENV}"

      - name: Verify pinned Maven runtime
        shell: bash
        run: |
          set -euo pipefail
          mvn --version
          MAVEN_VERSION_LINE="$(mvn --version | head -n 1)"
          if [[ "${MAVEN_VERSION_LINE}" != "Apache Maven 3.9.16"* ]]; then
            echo "Publishing requires Maven 3.9.16, got: ${MAVEN_VERSION_LINE}" >&2
            exit 1
          fi

      - name: Verify version and immutable release sources
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          TAG="v${VERSION}"
          if [ "${REQUESTED_VERSION}" != "${VERSION}" ]; then
            echo "Requested version does not match pom.xml." >&2
            exit 1
          fi
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "Snapshots are not accepted by this workflow." >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "Existing immutable release tag ${TAG} is missing." >&2
            exit 1
          fi
          if ! git diff --quiet "${TAG}" HEAD -- src; then
            echo "Sources or tests differ from release tag ${TAG}; refusing to stage." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Verify the release build
        run: mvn -B -ntp clean verify --file pom.xml

      - name: Verify artifact files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "target/mikrotik-${VERSION}.jar" \
            "target/mikrotik-${VERSION}-sources.jar" \
            "target/mikrotik-${VERSION}-javadoc.jar"
          do
            test -s "${file}" || { echo "Missing release artifact: ${file}" >&2; exit 1; }
          done

      - name: Compare compiled classes against GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-baseline"
          gh release download "${TAG}" \
            --pattern "mikrotik-${VERSION}.jar" \
            --dir "${RUNNER_TEMP}/release-baseline"
          python3 - "${RUNNER_TEMP}/release-baseline/mikrotik-${VERSION}.jar" "target/mikrotik-${VERSION}.jar" <<'PY'
          import sys
          from zipfile import ZipFile

          def class_files(path):
              with ZipFile(path) as archive:
                  return {
                      name: archive.read(name)
                      for name in archive.namelist()
                      if name.endswith(".class")
                  }

          original, rebuilt = map(class_files, sys.argv[1:])
          if not original or original != rebuilt:
              missing = sorted(set(original) - set(rebuilt))
              added = sorted(set(rebuilt) - set(original))
              altered = sorted(name for name in original.keys() & rebuilt.keys()
                               if original[name] != rebuilt[name])
              print(f"Compiled class mismatch; missing={missing}, added={added}, altered={altered}", file=sys.stderr)
              sys.exit(1)
          print(f"Compiled bytecode matches the existing GitHub Release ({len(original)} classes).")
          PY

      - name: Upload signed release bundle for manual Central approval
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CENTRAL_TOKEN_USERNAME}"
          test -n "${CENTRAL_TOKEN_PASSWORD}"
          test -n "${MAVEN_GPG_PASSPHRASE}"
          mvn -B -ntp -Pcentral-release deploy --file pom.xml
          echo "Central deployment was uploaded for validation, not automatically published."
